[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/iqdb", "crates/relation-fft", "native/terms", "desktop"]
exclude = ["native/terms/vendor/tiny_http"]

# 宿主的按连接超时和连接数限制使用同一份 vendored tiny_http（#25）。
[patch.crates-io]
tiny_http = { path = "native/terms/vendor/tiny_http" }

# 自有成员保持未优化并带行号表；第三方依赖沿用 terms 的优化，供测试重放和各成员共享（#130、#362）。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# 这份路径依赖由本项目修改，仍保留快速增量编译。
[profile.dev.package.tiny_http]
opt-level = 0

# 只保留原来两个发布二进制的 strip 行为，宿主和 worker 的 release 设置不变。
[profile.release.package.illustash-desktop]
strip = true

[profile.release.package.illustash-iqdb]
strip = true
