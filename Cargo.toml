[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/relation-fft", "native/terms", "desktop"]
# IQDB 保留独立的 image/zune 版本、锁文件和 profile，避免改变已有 JPEG 签名（#311）。
exclude = ["crates/iqdb", "native/terms/vendor/tiny_http"]

# 宿主的按连接超时和连接数限制使用同一份 vendored tiny_http（#25）。
[patch.crates-io]
tiny_http = { path = "native/terms/vendor/tiny_http" }

# 自有成员保持未优化并带行号表；第三方依赖沿用 terms 的优化，供测试重放和各成员共享（#130、#362）。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# 这份路径依赖由本项目修改，仍保留快速增量编译。
[profile.dev.package.tiny_http]
opt-level = 0

# 仅桌面使用的 Tauri 构建工具沿用原 dev 优化等级，避免冷编译被代码生成拖慢（#311）。
[profile.dev.package.tauri-utils]
opt-level = 0

[profile.dev.package.tauri-codegen]
opt-level = 0

[profile.dev.package.tauri-build]
opt-level = 0

# 保留原来桌面二进制的 strip 行为，宿主和 worker 的 release 设置不变。
[profile.release.package.illustash-desktop]
strip = true
