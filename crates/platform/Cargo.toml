[package]
name = "illustash-platform"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Illustash existing platform capabilities"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
illustash-core = { path = "../core" }
rusqlite = { version = "0.32", features = ["bundled", "functions", "backup", "hooks"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libc = "0.2"
md-5 = "0.10"
chrono = "0.4"
image = { version = "=0.25.6", default-features = false, features = ["png", "gif", "webp", "tiff", "bmp", "ico", "pnm", "tga"] }
mozjpeg = { version = "0.10", default-features = false, features = ["with_simd"] }

[dev-dependencies]
getrandom = "0.3"
