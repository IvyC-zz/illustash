[package]
name = "illustash-iqdb"
version = "0.1.0"
edition = "2021"
description = "找回画师：在本地计算 Danbooru IQDB 签名，只发哈希文本查相似帖子（docs/PROVENANCE.md 第 9 节）"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
