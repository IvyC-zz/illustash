# tools/gen_rust_licenses.py 用的 cargo-about 配置（#161）。
# Illustash 接受的 Rust crate 许可，按二选一（"A OR B"）时的选取顺序排列。
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
            "Zlib", "Unicode-3.0", "BSL-1.0", "IJG", "CDLA-Permissive-2.0", "MPL-2.0", "OpenSSL"]
# cargo-about 内置的澄清规则，用于我们 lock 文件里许可文件难以识别的 crate。
workarounds = ["chrono", "gtk", "ring", "rustls", "unicode-ident"]
# Illustash 自己的 crate（publish = false）是 GPL-3.0-or-later，由 licenses/LICENSE 覆盖。
private = { ignore = true }
