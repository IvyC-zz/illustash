# cargo-about configuration for tools/gen_rust_licenses.py (#161).
# Licenses Illustash accepts from Rust crates, in the order a choice ("A OR B") is resolved.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
            "Zlib", "Unicode-3.0", "BSL-1.0", "IJG", "CDLA-Permissive-2.0", "MPL-2.0", "OpenSSL"]
# cargo-about's built-in clarifications for crates in our lock files whose license files are hard to detect.
workarounds = ["chrono", "gtk", "ring", "rustls", "unicode-ident"]
# Illustash's own crates (publish = false) are GPL-3.0-or-later, covered by licenses/LICENSE.
private = { ignore = true }
