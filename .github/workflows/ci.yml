# PR 自动检查（#4）：目标为 main 的同库 PR 自动运行，作为额外保障；
# 合入 main 的门槛仍是集成会话在候选上跑的 tools/check_all.sh（AGENTS.md）。
# 只用仓库内合成数据；不接触真实图库、账号、Photos 或网络凭据，也不用任何 secret。
name: CI

# Linux 已冻结（README）：仅用 Ubuntu 分流、汇总和检查前端 JS。
# 草稿 PR 不跑（转 Ready 时跑），来自 fork 的 PR 不跑（暂不接受外部贡献），仓库私有时只跑手动触发的。
# push 到 main 只为给 PR 留可复用的编译缓存：PR 写的缓存别的 PR 读不到。
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# 同一 PR（或同一分支）有新提交时取消旧运行。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYTHON_VERSION: '3.12'

jobs:
  # 判断要不要跑：仓库私有时只跑手动触发的（私有库 macOS 按 10 倍计分钟）；fork、草稿 PR 不跑；
  # 只改文档（docs/ 和根目录的 Markdown）的 PR 跳过构建与测试，与 AGENTS.md「只改文档的 PR 不跑全量」一致。
  # docs/THIRD_PARTY.md 和 docs/BACKEND_TASKS.md 随安装包分发，按代码算。
  changes:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.repository.private &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)))
    name: 改动范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          # PR 检出的是它与 main 的合并提交：第一父提交就是当前 main。
          # 改名同时检查旧路径，避免把移入 docs/ 的代码删除误判成纯文档。
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          echo "改动 $(wc -l < "$RUNNER_TEMP/changed.txt") 个文件"
          if grep -qEv '^([^/]+|docs/.+)\.md$' "$RUNNER_TEMP/changed.txt" ||
             grep -qEx 'docs/(THIRD_PARTY|BACKEND_TASKS)\.md' "$RUNNER_TEMP/changed.txt"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo '只改文档，跳过构建与测试'
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Rust 核心
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            native/terms
            crates/iqdb
            crates/core
            crates/platform
      # http_browse 的对照测试调用 python3 运行参考实现。
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: Dependency boundary
        run: python tools/check_architecture.py
      - name: Frontend structure
        run: python tools/check_frontend.py --strict-stale
      - name: Style guide sync
        run: python tools/check_styleguide.py
      - name: Core fmt/clippy/test/build
        run: |
          cargo fmt --manifest-path crates/core/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/core/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/core/Cargo.toml
          cargo build --locked --manifest-path crates/core/Cargo.toml
      - name: Platform fmt/clippy/test/build
        run: |
          cargo fmt --manifest-path crates/platform/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/platform/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/platform/Cargo.toml
          cargo build --locked --manifest-path crates/platform/Cargo.toml
      - name: fmt
        run: cargo fmt --manifest-path native/terms/Cargo.toml --check
      - name: clippy
        run: cargo clippy --locked --manifest-path native/terms/Cargo.toml --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --locked --manifest-path native/terms/Cargo.toml
      # 0.7071 常数须与 haar.cpp 逐位一致，在源码里用 #[expect(clippy::approx_constant)] 写明，不按 clippy 改。
      - name: iqdb fmt/clippy/test
        run: |
          cargo fmt --manifest-path crates/iqdb/Cargo.toml --check
          cargo clippy --locked --manifest-path crates/iqdb/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/iqdb/Cargo.toml

  # 跑在 macOS arm64：固定期望（tests/fixtures/ 下的录制值）在 Apple Silicon 上录制，
  # float32 结果在 x86 上差 1 ulp；另有错误文案、zsh 启动脚本等平台差异。Windows 另行处理。
  python:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Python 全量 (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            native/terms
            crates/iqdb
            crates/core
            crates/platform
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - name: 构建被测核心与 IQDB
        run: |
          cargo build --release --locked --manifest-path native/terms/Cargo.toml
          # 读路由固定期望用的测试读宿主（tests/read_http_harness.py 按 release/examples 定位）。
          cargo build --release --locked --manifest-path native/terms/Cargo.toml --features test-read-host --example read-http --example recognition-compute --example index-compute --example research-compute --example relation-probe --example provenance-compute
          cargo build --release --locked --manifest-path crates/iqdb/Cargo.toml
      - name: unittest
        env:
          ILLUSTASH_TERMS_BIN: ${{ github.workspace }}/native/terms/target/release/illustash-terms
          ILLUSTASH_NATIVE_ROOT: ${{ github.workspace }}
          ILLUSTASH_IQDB_BINARY: ${{ github.workspace }}/crates/iqdb/target/release/illustash-iqdb
          ILLUSTASH_READ_HTTP_BIN: ${{ github.workspace }}/native/terms/target/release/examples/read-http
          ILLUSTASH_RECOGNITION_COMPUTE_BIN: ${{ github.workspace }}/native/terms/target/release/examples/recognition-compute
          ILLUSTASH_INDEX_COMPUTE_BIN: ${{ github.workspace }}/native/terms/target/release/examples/index-compute
          ILLUSTASH_RELATION_PROBE_BIN: ${{ github.workspace }}/native/terms/target/release/examples/relation-probe
          ILLUSTASH_PROVENANCE_COMPUTE_BIN: ${{ github.workspace }}/native/terms/target/release/examples/provenance-compute
          ILLUSTASH_RESEARCH_COMPUTE_BIN: ${{ github.workspace }}/native/terms/target/release/examples/research-compute
          ILLUSTASH_RESEARCH_ADAPTER_BIN: ${{ github.workspace }}/native/terms/target/release/illustash-worker
          ILLUSTASH_INDEX_ADAPTER_BIN: ${{ github.workspace }}/native/terms/target/release/illustash-worker
        run: |
          set -o pipefail
          # -b：失败测试的输出（如被测服务日志）附在末尾失败报告里，不散落在日志中段。
          python -m tests.run_fixed_suite -v -b 2>&1 | tee "$RUNNER_TEMP/unittest.log"
      - name: 上传测试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-log
          path: ${{ runner.temp }}/unittest.log
          retention-days: 7
      # 跳过必须可见：列出全部跳过及原因。只允许平台限制和依赖真实图库的数据缺失；
      # 其余跳过（缺被测二进制等）在 CI 中视为未验收，判失败。
      - name: 跳过清单
        if: always()
        run: |
          log="$RUNNER_TEMP/unittest.log"
          [ -f "$log" ] || exit 0
          grep -E " \.\.\. skipped " "$log" > "$RUNNER_TEMP/skips.txt" || true
          {
            echo "### Python 跳过：$(wc -l < "$RUNNER_TEMP/skips.txt") 项"
            echo '```'
            cat "$RUNNER_TEMP/skips.txt"
            echo '```'
            tail -n 3 "$log"
          } >> "$GITHUB_STEP_SUMMARY"
          allowed="full-features\.npy not present|POSIX|posix|Unix|macOS/Linux only|Windows pinned OpenBLAS backend only|explicit Windows native development calculator only|explicit Windows development App publication only|Linux is frozen: no local computation"
          if grep -Ev "$allowed" "$RUNNER_TEMP/skips.txt"; then
            echo "::error::以上跳过不属于平台限制或真实图库数据缺失，CI 中视为未验收"
            exit 1
          fi

  js:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: 前端 JS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.cjs tests/test_pixiv_poll.js

  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: 桌面壳 (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: desktop
      - name: fmt
        run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - name: clippy
        run: cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --manifest-path desktop/Cargo.toml

  contracts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: 原生固定契约（无 Python）
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: native/terms
      - name: 构建独立重放可执行文件
        run: |
          cargo test --release --locked --manifest-path native/terms/Cargo.toml --test contracts --no-run --message-format=json > "$RUNNER_TEMP/contracts-artifacts.jsonl"
      - name: 空 PATH / 独立 HOME 重放
        run: |
          binary=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "contracts" and .executable != null) | .executable' "$RUNNER_TEMP/contracts-artifacts.jsonl")
          [ -n "$binary" ] && [ -x "$binary" ]
          tools/test_native_contracts.sh "$binary"

  windows:
    needs: [changes, js]
    if: needs.changes.outputs.code == 'true' && !github.event.repository.private
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 验收机的五份 target 冷构建约 14.5 GB；CI 依赖缓存不需要工作区的增量目录。
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
      NUMPY_VERSION: '2.5.3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 缩短测试临时目录
        run: |
          $tempDir = Join-Path "${env:SystemDrive}\" 'it'
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          "TEMP=$tempDir", "TMP=$tempDir" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            native/terms
            crates/iqdb
            crates/core
            crates/platform
            desktop
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: 还原 NumPy wheel
        uses: actions/cache/restore@v4
        id: numpy-wheel
        with:
          path: ${{ runner.temp }}/numpy-wheel
          key: numpy-${{ env.NUMPY_VERSION }}-cp${{ env.PYTHON_VERSION }}-win_amd64
      - name: 安装 Python 依赖并核验 OpenBLAS
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $wheelDir = Join-Path $env:RUNNER_TEMP 'numpy-wheel'
          if ('${{ steps.numpy-wheel.outputs.cache-hit }}' -ne 'true') {
            python -m pip download --index-url https://pypi.org/simple --no-deps --only-binary=:all: --dest $wheelDir "numpy==$env:NUMPY_VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $wheel = @(Get-ChildItem -Path $wheelDir -Filter "numpy-$env:NUMPY_VERSION-*-win_amd64.whl" -File)
          if ($wheel.Count -ne 1) { throw '需要且只能有一个固定版本的 Windows x64 NumPy wheel' }
          # 直接安装同一个 wheel，保证 Python 对照和原生后端用同一份 DLL。
          python -m pip install --force-reinstall -r tests/requirements.txt $wheel[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = @'
          import os
          from pathlib import Path
          import runpy
          import sysconfig

          pack = runpy.run_path('packaging/build.py')
          dll, _, digest = pack['research_openblas'](Path(sysconfig.get_path('platlib')))
          if pack['RESEARCH_OPENBLAS_IDENTITIES'][digest]['numpy'] != os.environ['NUMPY_VERSION']:
              raise SystemExit(f'OpenBLAS SHA-256 {digest} 与固定 NumPy 版本不匹配')
          print(dll)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ILLUSTASH_RESEARCH_OPENBLAS_DLL=$dll" >> $env:GITHUB_ENV
      - name: 保存已核验的 NumPy wheel
        if: github.ref == 'refs/heads/main' && steps.numpy-wheel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/numpy-wheel
          key: ${{ steps.numpy-wheel.outputs.cache-primary-key }}
      - name: Core clippy/test
        run: |
          cargo clippy --locked --manifest-path crates/core/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path crates/core/Cargo.toml
      - name: Platform clippy/test
        run: |
          cargo clippy --locked --manifest-path crates/platform/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path crates/platform/Cargo.toml
      - name: Desktop clippy/test
        run: |
          cargo clippy --locked --manifest-path desktop/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path desktop/Cargo.toml
      - name: Terms clippy/test
        run: |
          cargo clippy --locked --manifest-path native/terms/Cargo.toml --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path native/terms/Cargo.toml
      - name: IQDB test
        run: cargo test --locked --manifest-path crates/iqdb/Cargo.toml
      - name: 构建被测核心与 IQDB
        run: |
          cargo build --release --locked --manifest-path native/terms/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --manifest-path native/terms/Cargo.toml --features test-read-host --example read-http --example recognition-compute --example index-compute --example research-compute --example relation-probe --example provenance-compute
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --manifest-path crates/iqdb/Cargo.toml
      - name: Python 全量与跳过清单
        env:
          ILLUSTASH_TERMS_BIN: ${{ github.workspace }}/native/terms/target/release/illustash-terms.exe
          ILLUSTASH_NATIVE_ROOT: ${{ github.workspace }}
          ILLUSTASH_IQDB_BINARY: ${{ github.workspace }}/crates/iqdb/target/release/illustash-iqdb.exe
          ILLUSTASH_READ_HTTP_BIN: ${{ github.workspace }}/native/terms/target/release/examples/read-http.exe
          ILLUSTASH_RECOGNITION_COMPUTE_BIN: ${{ github.workspace }}/native/terms/target/release/examples/recognition-compute.exe
          ILLUSTASH_INDEX_COMPUTE_BIN: ${{ github.workspace }}/native/terms/target/release/examples/index-compute.exe
          ILLUSTASH_RELATION_PROBE_BIN: ${{ github.workspace }}/native/terms/target/release/examples/relation-probe.exe
          ILLUSTASH_PROVENANCE_COMPUTE_BIN: ${{ github.workspace }}/native/terms/target/release/examples/provenance-compute.exe
          ILLUSTASH_RESEARCH_COMPUTE_BIN: ${{ github.workspace }}/native/terms/target/release/examples/research-compute.exe
          ILLUSTASH_RESEARCH_ADAPTER_BIN: ${{ github.workspace }}/native/terms/target/release/illustash-worker.exe
          ILLUSTASH_INDEX_ADAPTER_BIN: ${{ github.workspace }}/native/terms/target/release/illustash-worker.exe
        run: python -m tests.windows_fixed_suite --log "${{ runner.temp }}/windows-unittest.log"
      - name: 上传 Windows 测试日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unittest-log
          path: ${{ runner.temp }}/windows-unittest.log
          if-no-files-found: ignore
          retention-days: 7

  # 分支保护只要求这一项：job 改名或增减时不用改保护规则。只有确认只改文档才容许跳过构建；
  # 来自 fork 的 PR 没有运行检查，这里判失败。草稿 PR 不跑，转 Ready 后重跑；仓库私有时同「改动范围」。
  # Windows 试运行期间展示实际结论，暂不计入代码 PR 的通过判定。
  ok:
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || !github.event.repository.private) &&
      !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    needs: [changes, core, python, js, desktop, contracts, windows]
    name: 全部检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          if ! jq -e '
            .changes.result == "success" and
            (.changes.outputs.code as $code |
              if $code == "true" then
                all(to_entries[]; .key == "changes" or .key == "windows" or .value.result == "success")
              elif $code == "false" then
                all(to_entries[]; .key == "changes" or .value.result == "skipped")
              else false end)
          ' <<< "$NEEDS" > /dev/null; then
            echo '::error::检查未完成：代码改动必须全部成功，只有文档改动允许跳过；fork PR 不自动运行'
            exit 1
          fi
