# 升级测试的单独手动入口，可在任意分支上触发。PR 自动检查的 Python job 已经包含这一类
# （tests.run_fixed_suite 全量 discover），这里额外要求整类零跳过，供数据层改动单独复查。
name: Historical library upgrade

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Historical library upgrade (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/terms
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' 'Pillow>=10,<13'
      - run: cargo build --release --locked --manifest-path native/terms/Cargo.toml
      - name: Entire upgrade class, no skipped acceptance
        env:
          ILLUSTASH_TERMS_BIN: ${{ github.workspace }}/target/release/illustash-terms
          ILLUSTASH_NATIVE_ROOT: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName('tests.test_native_library_upgrade')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun == 0:
              raise SystemExit(1)
          PY
