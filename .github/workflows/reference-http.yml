name: Reference HTTP macOS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Reference HTTP regression (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/terms
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.26,<3' 'Pillow>=10,<13' 'onnxruntime>=1.18,<2'
      - name: Build core and reference host
        run: cargo build --release --locked --manifest-path native/terms/Cargo.toml --features test-reference-host --example reference-http --bin illustash-terms
      - name: Lifecycle regression
        env:
          ILLUSTASH_TERMS_BIN: ${{ github.workspace }}/native/terms/target/release/illustash-terms
          ILLUSTASH_REFERENCE_HTTP_BIN: ${{ github.workspace }}/native/terms/target/release/examples/reference-http
        run: python -m unittest tests.test_read_http -v -b
