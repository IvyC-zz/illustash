[package]
name = "illustash-desktop"
version = "0.2.0"
edition = "2021"
description = "Illustash 桌面外壳：启动原生 HTTP 服务、承载 Pixiv 登录窗口；不承载业务逻辑"
license = "GPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
illustash-platform = { path = "../crates/platform" }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tauri-plugin-dialog = "2"
# 应用内更新（#279，updater.rs）。默认特性：rustls、系统代理、zip。
tauri-plugin-updater = "2.14"
getrandom = "0.3"
libc = "0.2"
# 词条核心链进外壳：外壳兼当 illustash-terms 命令行（main.rs），版本与外壳一致，不另带边车程序。
illustash-terms = { path = "../native/terms" }

# 把图拖到别的应用（#450，drag.rs）：用 Tauri 已经带进来的同一版本，只多开几个 feature，不引入新的 crate。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSGraphicsContext", "NSImage", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[profile.release]
strip = true

# 与 illustash-terms 用同一份 tiny_http（#25）：它的 HTTP 宿主需要 vendored 版本里的连接数限制。
[patch.crates-io]
tiny_http = { path = "../native/terms/vendor/tiny_http" }

# 2026-10-29 用户定：每个 unsafe 块和 unsafe impl 都写 `// SAFETY:` 注释；生产代码不用 unwrap，
# 确实不会失败的地方用 expect 写明理由。测试里的 unwrap 由仓库根目录的 clippy.toml 放行。
[lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# dev 构建少带调试信息（#362）：自己的 crate 只带行号表，panic 和测试失败的回溯里仍有文件名和行号；
# 第三方依赖不带调试信息。只动 dev profile，release 不变。做法和数字见 docs/LOCAL_CHECKS.md。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.illustash-platform]
debug = "line-tables-only"

[profile.dev.package.illustash-core]
debug = "line-tables-only"

[profile.dev.package.illustash-terms]
debug = "line-tables-only"

[profile.dev.package.illustash-relation-fft]
debug = "line-tables-only"
