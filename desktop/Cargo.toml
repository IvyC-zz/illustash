[package]
name = "illustash-desktop"
version = "0.1.0"
edition = "2021"
description = "Illustash 桌面外壳：启动原生 HTTP 服务、承载 Pixiv 登录窗口；不承载业务逻辑"
license = "GPL-3.0-or-later"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
illustash-platform = { path = "../crates/platform" }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tauri-plugin-dialog = "2"
getrandom = "0.3"
libc = "0.2"
# 词条核心链进外壳：外壳兼当 illustash-terms 命令行（main.rs），版本与外壳一致，不另带边车程序。
illustash-terms = { path = "../native/terms" }

[profile.release]
strip = true

# 与 illustash-terms 用同一份 tiny_http（#25）：它的 HTTP 宿主需要 vendored 版本里的连接数限制。
[patch.crates-io]
tiny_http = { path = "../native/terms/vendor/tiny_http" }

# 2026-10-29 用户定：每个 unsafe 块和 unsafe impl 都写 `// SAFETY:` 注释；生产代码不用 unwrap，
# 确实不会失败的地方用 expect 写明理由。测试里的 unwrap 由仓库根目录的 clippy.toml 放行。
[lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
