[package]
name = "illustash-terms"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Illustash 应用宿主：Core 适配、CLI、HTTP、任务编排和平台能力"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
illustash-platform = { path = "../../crates/platform" }
illustash-core = { path = "../../crates/core" }
rusqlite = { version = "0.32", features = ["bundled", "functions", "backup", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
getrandom = "0.3"
tiny_http = "0.12"
libc = "0.2"
csv = "1.3"
sha1 = "0.10"
unicode-normalization = "=0.1.22" # Unicode 15.0, matching the Python 3.12 contract
flate2 = { version = "1", default-features = false, features = ["zlib"] }
image = { version = "=0.25.6", default-features = false, features = ["png", "gif", "webp", "tiff", "bmp", "ico", "pnm", "tga"] }
gif = "=0.13.3"
lcms2 = { version = "=5.6.0", features = ["static"] }
lcms2-sys = { version = "=4.0.7", default-features = false, features = ["static"] }
kamadak-exif = "0.6"
tiff = "=0.9.1" # Already locked by image; preserve raw CMYK before Pillow-equivalent resize.
tiff_display = { package = "tiff", version = "=0.10.3" } # Packed/LA/planar display samples; preserves MSRV 1.82.
mozjpeg = { version = "0.10", default-features = false, features = ["with_simd"] }
fast_image_resize = "=4.2.3"
md-5 = "0.10"
chrono = "0.4"
# CPU-only sessions; runtime is an explicit installed resource, never downloaded by Cargo.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }

ureq = { version = "=2.12.1", features = ["json"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate-zlib", "bzip2"] }
lzma-rs = "=0.3.0"
crc32fast = "1"

url = "=2.5.8"
regex = "=1.13.1"
httpdate = "=1.0.3"
serde_path_to_error = "0.1"

# Legacy transport exists only in an explicitly built test example, never the shipped CLI.
[features]
test-reference-host = []

[build-dependencies]
cc = "=1.5.1"

[[example]]
name = "reference-http"
required-features = ["test-reference-host"]

# The replay tests (tests/replay.rs) hash every table after each recorded call; an unoptimised
# bundled SQLite makes that the slowest part of `cargo test`.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
