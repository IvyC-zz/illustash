[package]
name = "illustash-terms"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Illustash 应用宿主：Core 适配、CLI、HTTP、任务编排和平台能力"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
illustash-platform = { path = "../../crates/platform" }
illustash-core = { path = "../../crates/core" }
rusqlite = { version = "0.32", features = ["bundled", "functions", "backup", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
getrandom = "0.3"
tiny_http = "0.12"
libc = "0.2"
csv = "1.3"
sha1 = "0.10"
unicode-normalization = "=0.1.22" # Unicode 15.0, matching the Python 3.12 contract
flate2 = { version = "1", default-features = false, features = ["zlib"] }
image = { version = "=0.25.6", default-features = false, features = ["png", "gif", "webp", "tiff", "bmp", "ico", "pnm", "tga"] }
gif = "=0.13.3"
lcms2 = { version = "=5.6.0", features = ["static"] }
lcms2-sys = { version = "=4.0.7", default-features = false, features = ["static"] }
kamadak-exif = "0.6"
tiff = "=0.9.1" # Already locked by image; preserve raw CMYK before Pillow-equivalent resize.
tiff_display = { package = "tiff", version = "=0.10.3" } # Packed/LA/planar display samples; preserves MSRV 1.82.
mozjpeg = { version = "0.10", default-features = false, features = ["with_simd"] }
fast_image_resize = "=4.2.3"
md-5 = "0.10"
chrono = "0.4"
# CPU-only sessions; runtime is an explicit installed resource, never downloaded by Cargo.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }

ureq = { version = "=2.12.1", features = ["json"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate-zlib", "bzip2"] }
lzma-rs = "=0.3.0"
crc32fast = "1"

url = "=2.5.8"
regex = "=1.13.1"
httpdate = "=1.0.3"
serde_path_to_error = "0.1"

# The core read host for read-route tests exists only in an explicitly built example, never the shipped CLI.
[features]
test-read-host = ["illustash-core/verify-incremental"]

# 测试构建（cargo test，含录制重放与固定契约启动的二进制）编进核心的对照核对；普通 cargo build 不编进去（#102）。
[dev-dependencies]
illustash-core = { path = "../../crates/core", features = ["verify-incremental"] }

[build-dependencies]
cc = "=1.5.1"
serde_json = "1"

[[example]]
name = "read-http"
required-features = ["test-read-host"]

# The baseline replay (tests/baseline.rs) reads every table after each recorded call; an unoptimised
# bundled SQLite makes that the slowest part of `cargo test`.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# tests/baseline.rs compares every table after each of ~9,000 recorded calls; unoptimized dependencies (hashing,
# regex masking, JSON, gzip, SQLite bindings) dominate its time (#130). Our own crates stay at the dev level, so
# editing them rebuilds as fast as before.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.illustash-core]
opt-level = 0

[profile.dev.package.illustash-platform]
opt-level = 0

[profile.dev.package.tiny_http]
opt-level = 0

# tiny_http 0.12 has no per-connection timeout or connection limit (#25); the vendored copy adds
# `Server::from_listener_with_limits`. Every build root linking this crate repeats this patch.
[patch.crates-io]
tiny_http = { path = "vendor/tiny_http" }
